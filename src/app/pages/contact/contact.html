<div class="bg-bkc-dark min-h-screen pt-32 pb-20 relative overflow-hidden">
  <!-- Background Elements -->
  <div class="absolute top-0 left-0 w-[500px] h-[500px] bg-red-600/10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- Page Header -->
  <div class="container mx-auto px-6 text-center mb-16 relative z-10">
    <span class="text-bkc-red font-bold tracking-[0.3em] text-sm uppercase mb-4 block animate-slide-up">
      Estamos aqui para ajudar
    </span>
    <h1 class="text-4xl md:text-6xl font-display font-bold text-white mb-6 animate-slide-up" style="animation-delay: 0.1s">
      FALE CONOSCO
    </h1>
    <p class="text-xl text-gray-400 font-light max-w-2xl mx-auto animate-slide-up" style="animation-delay: 0.2s">
      Entre em contato para dúvidas, inscrições e parcerias.
    </p>
  </div>

  <div class="container mx-auto px-6 relative z-10">
    <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row animate-slide-up" style="animation-delay: 0.3s">
      <!-- Contact Info -->
      <div class="bg-gradient-to-br from-bkc-red to-red-900 text-white p-12 md:w-1/3 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
        
        <h2 class="text-2xl font-display font-bold mb-10 relative z-10">Informações de Contato</h2>

        <div class="space-y-8 relative z-10">
          <div class="flex items-start group">
            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mr-6 group-hover:scale-110 transition-transform duration-300 backdrop-blur-sm">
              <span class="text-2xl">📍</span>
            </div>
            <div>
              <h3 class="font-bold mb-2 text-lg">Localização</h3>
              <p class="text-red-100 font-light leading-relaxed">
                PR-566 - Secção Jacaré<br />
                Francisco Beltrão - PR, 85609-450
              </p>
            </div>
          </div>

          <div class="flex items-start group">
            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mr-6 group-hover:scale-110 transition-transform duration-300 backdrop-blur-sm">
              <span class="text-2xl">📧</span>
            </div>
            <div>
              <h3 class="font-bold mb-2 text-lg">Email</h3>
              <p class="text-red-100 font-light">contato@bkc.com.br</p>
            </div>
          </div>

          <div class="flex items-start group">
            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mr-6 group-hover:scale-110 transition-transform duration-300 backdrop-blur-sm">
              <span class="text-2xl">📱</span>
            </div>
            <div>
              <h3 class="font-bold mb-2 text-lg">Redes Sociais</h3>
              <div class="flex space-x-4 mt-2">
                <a
                  href="https://www.instagram.com/kart.beltrao/"
                  target="_blank"
                  class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white hover:text-bkc-red transition-all duration-300"
                  ><i class="pi pi-instagram text-xl"></i
                ></a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="p-12 md:w-2/3 bg-gradient-to-br from-white/5 to-transparent">
        <h2 class="text-2xl font-display font-bold text-white mb-8">Envie uma Mensagem</h2>
        <form class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="group">
              <label class="block text-gray-400 text-sm font-bold mb-2 uppercase tracking-wider" for="name"
                >Nome Completo</label
              >
              <input
                class="w-full bg-[#1A1A1A] text-white border border-white/10 rounded-xl py-4 px-5 leading-tight focus:outline-none focus:border-bkc-red focus:ring-1 focus:ring-bkc-red transition-all duration-300 placeholder-gray-600"
                id="name"
                type="text"
                placeholder="Digite seu nome"
              />
            </div>
            <div class="group">
              <label class="block text-gray-400 text-sm font-bold mb-2 uppercase tracking-wider" for="email">Email</label>
              <input
                class="w-full bg-[#1A1A1A] text-white border border-white/10 rounded-xl py-4 px-5 leading-tight focus:outline-none focus:border-bkc-red focus:ring-1 focus:ring-bkc-red transition-all duration-300 placeholder-gray-600"
                id="email"
                type="email"
                placeholder="seu@email.com"
              />
            </div>
          </div>

          <div class="group">
            <label class="block text-gray-400 text-sm font-bold mb-2 uppercase tracking-wider" for="subject">Assunto</label>
            <div class="relative">
              <select
                class="w-full bg-[#1A1A1A] text-white border border-white/10 rounded-xl py-4 px-5 leading-tight focus:outline-none focus:border-bkc-red focus:ring-1 focus:ring-bkc-red transition-all duration-300 appearance-none"
                id="subject"
              >
                <option>Dúvidas Gerais</option>
                <option>Inscrição em Campeonatos</option>
                <option>Escola de Pilotos</option>
                <option>Parcerias e Patrocínios</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                <i class="pi pi-chevron-down"></i>
              </div>
            </div>
          </div>

          <div class="group">
            <label class="block text-gray-400 text-sm font-bold mb-2 uppercase tracking-wider" for="message">Mensagem</label>
            <textarea
              class="w-full bg-[#1A1A1A] text-white border border-white/10 rounded-xl py-4 px-5 leading-tight focus:outline-none focus:border-bkc-red focus:ring-1 focus:ring-bkc-red transition-all duration-300 placeholder-gray-600"
              id="message"
              rows="5"
              placeholder="Como podemos ajudar?"
            ></textarea>
          </div>

          <button
            class="bg-white text-black font-bold py-4 px-8 rounded-full shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:scale-105 hover:shadow-[0_0_30px_rgba(255,255,255,0.3)] transition-all duration-300 w-full md:w-auto"
          >
            ENVIAR MENSAGEM
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
