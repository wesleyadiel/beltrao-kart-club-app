<div class="bg-gray-50 min-h-screen pb-20">
  <!-- Page Header -->
  <div class="bg-gray-900 text-white py-20">
    <div class="container mx-auto px-4 text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Fale Conosco</h1>
      <p class="text-xl text-gray-400">Entre em contato para dúvidas, inscrições e parcerias.</p>
    </div>
  </div>

  <div class="container mx-auto px-4 -mt-10">
    <div class="bg-white rounded-lg shadow-xl overflow-hidden flex flex-col md:flex-row">
      <!-- Contact Info -->
      <div class="bg-red-700 text-white p-12 md:w-1/3">
        <h2 class="text-2xl font-bold mb-8">Informações</h2>

        <div class="space-y-6">
          <div class="flex items-start">
            <span class="text-2xl mr-4">📍</span>
            <div>
              <h3 class="font-bold mb-1">Endereço</h3>
              <p class="text-red-100 text-sm">
                PR-566 - Secção Jacaré<br />
                Francisco Beltrão - PR, 85609-450
              </p>
            </div>
          </div>

          <div class="flex items-start">
            <span class="text-2xl mr-4">📧</span>
            <div>
              <h3 class="font-bold mb-1">Email</h3>
              <p class="text-red-100 text-sm">contato@bkc.com.br</p>
            </div>
          </div>

          <div class="flex items-start">
            <span class="text-2xl mr-4">📱</span>
            <div>
              <h3 class="font-bold mb-1">Redes Sociais</h3>
              <div class="flex space-x-4 mt-2">
                <a
                  href="https://www.instagram.com/kart.beltrao/"
                  target="_blank"
                  class="text-white hover:text-red-200 transition text-2xl"
                  ><i class="pi pi-instagram"></i
                ></a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="p-12 md:w-2/3">
        <h2 class="text-2xl font-bold text-gray-900 mb-8">Envie uma Mensagem</h2>
        <form>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
              <label class="block text-gray-700 text-sm font-bold mb-2" for="name"
                >Nome Completo</label
              >
              <input
                class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-red-500"
                id="name"
                type="text"
                placeholder="Seu nome"
              />
            </div>
            <div>
              <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email</label>
              <input
                class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-red-500"
                id="email"
                type="email"
                placeholder="seu@email.com"
              />
            </div>
          </div>

          <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="subject">Assunto</label>
            <select
              class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-red-500"
              id="subject"
            >
              <option>Dúvidas Gerais</option>
              <option>Inscrição em Campeonatos</option>
              <option>Escola de Pilotos</option>
              <option>Parcerias e Patrocínios</option>
            </select>
          </div>

          <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="message">Mensagem</label>
            <textarea
              class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-red-500"
              id="message"
              rows="5"
              placeholder="Como podemos ajudar?"
            ></textarea>
          </div>

          <div class="flex items-center justify-end">
            <button
              class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded focus:outline-none focus:shadow-outline transition duration-200"
              type="button"
            >
              Enviar Mensagem
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
