<div class="bg-gray-50 min-h-screen pb-20">
  <!-- Page Header -->
  <div class="bg-gray-900 text-white py-20">
    <div class="container mx-auto px-4 text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Galeria Multimídia</h1>
      <p class="text-xl text-gray-400">Confira os melhores momentos das nossas pistas.</p>
    </div>
  </div>

  <div class="container mx-auto px-4 mt-12">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @if (isLoading()) {
      <div class="col-span-full flex justify-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600"></div>
      </div>
      } @else { @for (photo of galleryPhotos(); track $index) {
      <div class="group relative overflow-hidden rounded-xl shadow-lg cursor-pointer h-64">
        <img
          [src]="photo"
          alt="Kart Gallery"
          class="w-full h-full object-cover transform transition duration-500 group-hover:scale-110"
        />
        <div
          class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition duration-300 flex items-center justify-center"
        >
          <span class="text-white text-lg font-bold border-2 border-white px-6 py-2 rounded-full"
            >Ver Foto</span
          >
        </div>
      </div>
      } }
    </div>

    <div class="text-center mt-16 space-y-4">
      <p class="text-gray-600">Quer ver mais fotos e vídeos?</p>

      <div class="flex flex-col md:flex-row justify-center gap-4">
        <a
          [href]="googleMapsUrl"
          target="_blank"
          class="inline-flex items-center justify-center bg-blue-600 text-white px-6 py-3 rounded-full font-bold hover:bg-blue-700 transition"
        >
          <i class="pi pi-map-marker mr-2 text-xl"></i> Ver no Google Maps
        </a>

        <a
          href="#"
          class="inline-flex items-center justify-center text-red-600 font-bold hover:text-red-800 transition px-6 py-3"
        >
          <i class="pi pi-instagram mr-2 text-2xl"></i> Siga-nos no Instagram
        </a>
      </div>
    </div>
  </div>
</div>
