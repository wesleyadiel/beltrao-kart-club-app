<div class="bg-bkc-dark min-h-screen pt-32 pb-20 relative overflow-hidden">
  <!-- Background Elements -->
  <div
    class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-red-600/10 rounded-full blur-[100px] pointer-events-none"
  ></div>

  <!-- Page Header -->
  <div class="container mx-auto px-6 text-center mb-16 relative z-10">
    <span
      class="text-bkc-red font-bold tracking-[0.3em] text-sm uppercase mb-4 block animate-slide-up"
    >
      Momentos Inesquecíveis
    </span>
    <h1
      class="text-4xl md:text-6xl font-display font-bold text-white mb-6 animate-slide-up"
      style="animation-delay: 0.1s"
    >
      GALERIA MULTIMÍDIA
    </h1>
    <p
      class="text-xl text-gray-400 font-light max-w-2xl mx-auto animate-slide-up"
      style="animation-delay: 0.2s"
    >
      Confira os melhores momentos das nossas pistas e eventos.
    </p>
  </div>

  <div class="container mx-auto px-6 relative z-10">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @if (isLoading()) {
      <div class="col-span-full flex justify-center py-20">
        <div
          class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-bkc-red shadow-[0_0_20px_rgba(230,0,0,0.5)]"
        ></div>
      </div>
      } @else { @for (photo of galleryPhotos(); track $index) {
      <div
        class="group relative overflow-hidden rounded-2xl shadow-2xl cursor-pointer h-72 border border-white/5 hover:border-white/20 transition-all duration-300"
      >
        <div
          class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent opacity-60 z-10"
        ></div>
        <img
          [src]="photo"
          alt="Kart Gallery"
          class="w-full h-full object-cover transform transition duration-700 group-hover:scale-110 group-hover:grayscale-0 grayscale"
        />
        <div
          class="absolute inset-0 z-20 opacity-0 group-hover:opacity-100 transition duration-300 flex items-center justify-center backdrop-blur-sm bg-black/30"
        >
          <span
            class="text-white text-sm font-bold tracking-widest border border-white/30 px-8 py-3 rounded-full hover:bg-white hover:text-black transition-all duration-300 shadow-[0_0_20px_rgba(255,255,255,0.2)]"
            >AMPLIAR</span
          >
        </div>
      </div>
      } }
    </div>

    <div class="text-center mt-24 space-y-8 animate-slide-up" style="animation-delay: 0.4s">
      <p class="text-gray-400 font-light text-lg">Quer ver mais fotos e vídeos?</p>

      <div class="flex flex-col md:flex-row justify-center gap-6">
        <a
          [href]="googleMapsUrl"
          target="_blank"
          class="group inline-flex items-center justify-center bg-[#1A1A1A] text-white border border-white/10 px-8 py-4 rounded-full font-bold hover:bg-blue-600 hover:border-blue-500 transition-all duration-300 shadow-lg hover:shadow-blue-900/50"
        >
          <i
            class="pi pi-map-marker mr-3 text-xl text-blue-500 group-hover:text-white transition-colors"
          ></i>
          <span>Ver no Google Maps</span>
        </a>

        <a
          href="#"
          class="group inline-flex items-center justify-center bg-[#1A1A1A] text-white border border-white/10 px-8 py-4 rounded-full font-bold hover:bg-gradient-to-r hover:from-purple-600 hover:to-pink-600 hover:border-transparent transition-all duration-300 shadow-lg hover:shadow-pink-900/50"
        >
          <i
            class="pi pi-instagram mr-3 text-2xl text-pink-500 group-hover:text-white transition-colors"
          ></i>
          <span>Siga-nos no Instagram</span>
        </a>
      </div>
    </div>
  </div>
</div>
